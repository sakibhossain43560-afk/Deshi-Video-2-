    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#000; color:#fff;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            padding-top:56px;
        }
        header {
            position:fixed; top:0; left:0; right:0; height:56px;
            background:#0d0d0d; display:flex; align-items:center;
            justify-content:space-between; padding:0 18px;
            border-bottom:1px solid #222; z-index:100;
        }
        .logo { position:absolute; left:50%; transform:translateX(-50%);
                font-weight:bold; font-size:19px; }
        .logo span { color:#ff9800; }

        /* ভিডিও ফিড কন্টেইনার */
        .video-feed {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px 12px 40px;
        }

        /* প্রতিটি ভিডিও আইটেম কার্ড */
        .video-item {
            background: #111;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            border: 1px solid #222;
        }

        /* থাম্বনেইল কন্টেইনার */
        .video-thumbnail {
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 aspect ratio */
            position: relative;
            background-color: #000;
            background-size: cover;
            background-position: center;
        }

        /* থাম্বনেইলের উপর ব্লার এফেক্ট */
        .video-thumbnail::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(2px);
            -webkit-backdrop-filter: blur(2px);
            z-index: 1;
        }

        /* প্লে বাটন */
        .play-button {
            width: 60px;
            height: 60px;
            background: rgba(255,255,255,0.15);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid rgba(255,255,255,0.2);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            backdrop-filter: blur(3px);
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 3;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
            animation: pulse 2.5s infinite;
        }

        .play-button:hover {
            background: rgba(255,255,255,0.25);
            transform: translate(-50%, -50%) scale(1.05);
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 4px 15px rgba(0,0,0,0.4); }
            50% { box-shadow: 0 4px 20px rgba(255,152,0,0.3); }
        }

        /* লোডিং স্পিনার */
        .spinner {
            display: none;
            width: 28px;
            height: 28px;
            border: 3px solid rgba(255, 255, 255, 0.2);
            border-top: 3px solid #ff9800;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* লোডিং অবস্থা */
        .is-loading svg { display: none; }
        .is-loading .spinner { display: block; }
        .is-loading .play-button { animation: none; pointer-events: none; background: rgba(0,0,0,0.5); }

        /* ভিডিওর তথ্য */
        .video-info {
            padding: 16px;
        }

        .video-title {
            font-size: 16px;
            font-weight: 600;
            color: #eee;
            margin-bottom: 8px;
            line-height: 1.3;
        }

        .video-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            color: #aaa;
        }

        .views {
            color: #ff4444;
            font-weight: 600;
        }

        .rating {
            display: flex;
            gap: 2px;
        }

        .rating svg {
            width: 18px;
            height: 18px;
            fill: #ffb400;
            filter: drop-shadow(0 0 3px #ff9800);
        }

    </style>
</head>

<script>
    const playButtons = document.querySelectorAll('.play-button');

    playButtons.forEach(button => {
        button.addEventListener('click', function() {
            const videoItem = this.closest('.video-item');
            const fbLink = videoItem.getAttribute('data-fb-link');

            // লোডিং অবস্থা শুরু
            videoItem.classList.add('is-loading');

            // ৫ সেকেন্ড পরে রিডাইরেক্ট
            setTimeout(function() {
                window.location.href = fbLink;
            }, 5000);
        });
    });

    // ব্যাক বাটন নিষ্ক্রিয় করার কোড
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
        history.go(1);
    };

</script>
